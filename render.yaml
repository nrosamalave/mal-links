# Mal's links page (his TikTok bio link): a static site on Render's free plan, so it never sleeps and opens instantly.
# Render → New → Blueprint → pick this repo → Apply. Then in GoDaddy: CNAME `links` → the site's .onrender.com address.
services:
  - type: web
    name: mal-links
    runtime: static
    buildCommand: echo "nothing to build"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache  # phones check for a newer page each visit, so an edit shows up right away
    domains:
      - links.askmal.live
